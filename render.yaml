services:
  - type: web
    name: ipl-analytics-pro-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: IPL_CORS_ORIGINS
        value: https://ipl-analytics-pro.onrender.com

  - type: web
    name: ipl-analytics-pro
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ipl-analytics-pro-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
